name: Build TempoTec V1 firmware

on:
  workflow_dispatch:
    inputs:
      stock_firmware_url:
        description: Optional stock firmware URL (empty uses the bundled V1 1.3 archive)
        required: false
        type: string
      acknowledge_community_build:
        description: I understand this is an unofficial community build and will keep the matching official firmware and checksum for recovery
        required: true
        type: boolean
        default: false
      # What to build, and what to do with it, said out loud. A run's artifact
      # is named after the commit it was built from, but which commit that is
      # has always been the ref the run was started on -- so a release cut from
      # "the newest artifact" could be an image of a branch that predates a
      # merge, which is exactly how the 1.3.1.1 image came to be missing the
      # Immersive work its own tag carried. These two inputs make the answer a
      # decision rather than a guess: build this ref, and if it is a release's
      # own commit, put it on that release.
      build_ref:
        description: Ref to build (branch, tag or commit). Empty builds the ref this was dispatched from.
        required: false
        type: string
      publish_release_tag:
        description: Release tag to upload the built image to, replacing its assets (v1.upt, v1_md5.txt). Empty publishes nothing.
        required: false
        type: string
  # Firmware builds are published only from the branch that produces
  # installable images. Develop on dev without running the long firmware build;
  # merging dev into personal starts the build for that destination.
  # Manual dispatch and tags remain available for deliberate builds/releases.
  push:
    branches:
      - personal
    tags:
      - '*'

permissions:
  contents: write

concurrency:
  group: tempotec-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  STOCK_FIRMWARE_URL: ${{ inputs.stock_firmware_url }}

jobs:
  # Before anything is cross-compiled: the host build and every suite, from the
  # one definition in tests.yml. A red suite fails this job, and the firmware
  # job never starts -- so a release cannot be cut from a tree whose tests fail.
  tests:
    name: Tests before packaging
    uses: ./.github/workflows/tests.yml

  firmware:
    name: Cross-compile and package v1.upt
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Require firmware-build acknowledgement
        if: github.event_name == 'workflow_dispatch' && inputs.acknowledge_community_build != true
        run: |
          echo 'This workflow creates an unofficial TempoTec V1 firmware image.' >&2
          echo 'Keep the matching official stock firmware and checksum available for recovery.' >&2
          echo 'Run it again and select the acknowledgement checkbox.' >&2
          exit 1

      - name: Check out source
        uses: actions/checkout@v5
        with:
          # The ref asked for, when one was: a run started on a working branch
          # with build_ref set to a tag builds the tag, not the branch. Left
          # empty, this is the run's own ref, as it always was.
          ref: ${{ inputs.build_ref || github.sha }}
          # The release step below bumps a tag, and it reads the tags from
          # this checkout: a shallow clone carries none of them.
          fetch-depth: 0

      # The one line every later step and every report reads. GITHUB_SHA is
      # the ref the run was STARTED on, which is not the ref that was built
      # once build_ref is in play; the checkout is the truth, so the artifact
      # name, the build report and the release upload all take it from here.
      - name: Record the revision being built
        id: source
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          subject="$(git log -1 --format=%s)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Building $sha"
          echo "  $subject"
          {
            echo "### Built revision"
            echo '```'
            echo "$sha  $subject"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


      # The version this build will be released as, decided before the image is
      # built rather than after it: a personal image stamps it into
      # system-info.json as the installed OS version, and the update check
      # compares release tags against exactly that string. Doing it first is
      # what lets About, the tag and the updater agree; the cost is that a tag
      # exists for a build that might fail, which the next push steps past.
      - name: Bump the version for a personal build
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/personal'
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A patch for every push; a commit saying #major or #minor wins over
          # this, and #none refuses to tag. BRANCH_HISTORY=last reads the
          # pushed commit rather than the whole history.
          DEFAULT_BUMP: patch
          BRANCH_HISTORY: last
          # Only personal releases. Without this the action treats a branch
          # that is not the default one as a prerelease (v1.0.1-beta.1).
          RELEASE_BRANCHES: personal
          TAG_PREFIX: v
          # A fork with no tags starts here, so the first push makes v1.0.1.
          # The versions the upstream project tags (1.4.3, ...) are not in
          # this repository's tags.
          INITIAL_VERSION: 1.1.0

      - name: Install build and firmware tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git pkg-config wget curl ca-certificates \
            texinfo bison flex gawk gperf patch xz-utils bzip2 gzip \
            autoconf automake libtool libtool-bin \
            libgmp-dev libmpfr-dev libmpc-dev \
            p7zip-full squashfs-tools genisoimage python3 python3-venv
          python3 -m venv "$RUNNER_TEMP/gdown-venv"
          "$RUNNER_TEMP/gdown-venv/bin/pip" install --disable-pip-version-check gdown

      - name: Download official TempoTec V1 firmware
        if: env.STOCK_FIRMWARE_URL != ''
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v1-stock-download"
          case "$STOCK_FIRMWARE_URL" in
            *drive.google.com/drive/folders/*)
              "$RUNNER_TEMP/gdown-venv/bin/gdown" --folder "$STOCK_FIRMWARE_URL" \
                -O "$RUNNER_TEMP/v1-stock-download"
              ;;
            *drive.google.com/*)
              "$RUNNER_TEMP/gdown-venv/bin/gdown" --fuzzy "$STOCK_FIRMWARE_URL" \
                -O "$RUNNER_TEMP/v1-stock-download/download"
              ;;
            *)
              curl --fail --location --retry 5 --retry-all-errors \
                "$STOCK_FIRMWARE_URL" -o "$RUNNER_TEMP/v1-stock-download/download"
              ;;
          esac
          find "$RUNNER_TEMP/v1-stock-download" -type f -printf '%P  %s bytes\n'

      - name: Prepare and validate stock image
        id: stock
        run: |
          set -euo pipefail
          chmod +x sonix-packer/*.sh
          if [ -n "$STOCK_FIRMWARE_URL" ]; then
            stock_input="$RUNNER_TEMP/v1-stock-download"
          else
            stock_input="sonix-packer/firmware-input/v1_upload.7z.001"
          fi
          sonix-packer/prepare_v1_stock.sh "$stock_input" sonix-packer
          sonix-packer/verify_upt.sh sonix-packer/v1_original.upt \
            | tee "$RUNNER_TEMP/v1-stock-validation.txt"
          kernel_sha256="$(sed -n 's/^Kernel SHA-256: //p' "$RUNNER_TEMP/v1-stock-validation.txt")"
          test -n "$kernel_sha256"
          echo "kernel_sha256=$kernel_sha256" >> "$GITHUB_OUTPUT"

      - name: Restore MIPS toolchain and target-library cache
        uses: actions/cache@v5
        with:
          path: |
            sonix-player/rockbox-toolchain
            sonix-player/freetype-target
            sonix-player/audio-target
            sonix-player/*.tar.gz
            sonix-player/*.tar.bz2
            sonix-player/*.tar.xz
          key: v2-mips-target-${{ runner.os }}-${{ hashFiles('sonix-player/Makefile', 'sonix-player/rockboxdev/**') }}
          restore-keys: |
            v2-mips-target-${{ runner.os }}-

      - name: Build TempoTec V1 target binaries
        working-directory: sonix-player
        # The InnerTube key YouTube Music's requests carry is a build input, not
        # a file in this repository. Set a `YTMUSIC_API_KEY` secret to compile
        # one in; without the secret the build still succeeds and YouTube Music
        # reports ytmusic_api_key_missing instead of asking without a key.
        env:
          YTMUSIC_API_KEY: ${{ secrets.YTMUSIC_API_KEY }}
        run: make target -j"$(nproc)"


      # A personal image is a release of this fork, not of upstream: it says
      # which version it is (OS_version, which the update check measures
      # releases against), it looks for updates in this repository's releases
      # (ota-repo), and About credits whoever built it (forked-by). Nothing
      # here runs on main or a tag build, so those images keep exactly
      # what their asset file says.
      - name: Stamp the personal build's version and update source
        if: github.event_name == 'push' && github.ref == 'refs/heads/personal'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.new_tag }}
          UPDATE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          test -n "$version"
          info=sonix-packer/assets/V1/usr/resource/sonix/components/system-info.json
          test -f "$info"
          python3 - "$info" "$version" "$UPDATE_REPO" <<'PY'
          import json, sys
          path, version, repo = sys.argv[1:4]
          with open(path, encoding="utf-8") as f:
              data = json.load(f)
          data["OS_version"] = version
          data["ota-repo"] = repo
          data["forked-by"] = "qirke (github.com/qir3k)"
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=4)
              f.write("\n")
          PY
          cat "$info"

      - name: Build v1.upt
        run: |
          install -m 0755 sonix-player/sonix_player sonix-packer/sonix_player
          install -m 0755 sonix-player/sonix_launch sonix-packer/sonix_launch
          sonix-packer/sonix_firmware_packer.sh

      - name: Validate generated firmware and unchanged kernel
        run: |
          sonix-packer/verify_upt.sh sonix-packer/v1.upt \
            --sonix-v1 --kernel-sha256 '${{ steps.stock.outputs.kernel_sha256 }}' \
            | tee "$RUNNER_TEMP/v1-output-validation.txt"

      - name: Assemble downloadable artifact
        env:
          KERNEL_SHA256: ${{ steps.stock.outputs.kernel_sha256 }}
          BUILT_SHA: ${{ steps.source.outputs.sha }}
          BUILT_REF: ${{ github.ref_type }} ${{ inputs.build_ref || github.ref_name }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/sonix-tempotec-v1"
          mkdir -p "$out"
          cp sonix-packer/v1.upt sonix-packer/v1_md5.txt "$out/"
          cp sonix-player/sonix_player sonix-player/sonix_player_debug \
             sonix-player/sonix_launch "$out/"
          cp "$RUNNER_TEMP/v1-stock-validation.txt" "$out/STOCK-VALIDATION.txt"
          cp "$RUNNER_TEMP/v1-output-validation.txt" "$out/OUTPUT-VALIDATION.txt"
          # What the packer found in the stock boot script and what it put
          # there: the one page that tells a boot-screen patch story straight.
          if [ -f sonix-packer/boot-script-report.txt ]; then
            cp sonix-packer/boot-script-report.txt "$out/BOOT-SCRIPT-REPORT.txt"
            { echo "## Boot script patch report"; echo '```'; cat sonix-packer/boot-script-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          image_sha256="$(sha256sum sonix-packer/v1.upt | awk '{print $1}')"
          image_md5="$(md5sum sonix-packer/v1.upt | awk '{print $1}')"
          cat > "$out/BUILD-REPORT.txt" <<EOF
          COMMUNITY TEMPOTEC V1 FIRMWARE BUILD

          Commit: ${BUILT_SHA}
          Built from: ${BUILT_REF}
          Actions run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Stock firmware source: ${STOCK_FIRMWARE_URL:-bundled V1 1.3 archive}
          Stock/output kernel SHA-256: ${KERNEL_SHA256}
          v1.upt SHA-256: ${image_sha256}
          v1.upt MD5: ${image_md5}

          The package structure, rootfs hash chain, Sonix installation, model
          identity, and unchanged stock kernel were checked automatically.
          This workflow does not install or re-test the generated image on
          physical hardware. Keep the official stock firmware and its matching
          checksum available before installing it.
          EOF

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v5
        with:
          # The commit the image was built from, not the ref the run was
          # started on: this name is what says which of the artifacts in the
          # list holds which tree.
          name: sonix-tempotec-v1-${{ steps.source.outputs.sha }}
          path: ${{ runner.temp }}/sonix-tempotec-v1/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # A tag is a promise that the image under it was built from the commit
      # that tag names. It is checked and only then kept: a run asked for a
      # release's own commit puts the image on that release, replacing whatever
      # is there -- which is how an image built from a branch that predated a
      # merge gets corrected rather than published as the version it is not.
      - name: Publish the image to its release
        if: github.ref_type == 'tag' || inputs.publish_release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILT_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_TAG: ${{ inputs.publish_release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)"
          echo "release $RELEASE_TAG is $tag_sha; this image is $BUILT_SHA"
          if [ "$tag_sha" != "$BUILT_SHA" ]; then
            echo "::error::the image was built from $BUILT_SHA and $RELEASE_TAG names $tag_sha. Nothing was published."
            exit 1
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG has no release yet; the artifact above carries the image."
            echo "Create the release, then run this workflow again with publish_release_tag=$RELEASE_TAG."
            exit 0
          fi
          gh release upload "$RELEASE_TAG" sonix-packer/v1.upt sonix-packer/v1_md5.txt --clobber
          local_size="$(stat -c%s sonix-packer/v1.upt)"
          remote_size="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq '.assets[] | select(.name == "v1.upt") | .size')"
          [ "$local_size" = "$remote_size" ] || {
            echo "::error::the release holds a $remote_size byte v1.upt and this build made $local_size bytes."
            exit 1
          }
          {
            echo "### Published to release $RELEASE_TAG"
            echo "v1.upt, $local_size bytes, built from $BUILT_SHA."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the tag names this build
        if: github.event_name == 'push' && github.ref == 'refs/heads/personal'
        env:
          TAG: ${{ steps.version.outputs.new_tag }}
          BUILT_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          # A commit saying #none leaves the action with a tag it never made:
          # no release can be published for it, and saying so beats a release
          # page that points at a version nobody can check out.
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::no tag ${TAG} was created for this build; nothing was released."
            exit 1
          fi
          tag_sha="$(git rev-parse "refs/tags/${TAG}")"
          if [ "$tag_sha" != "$BUILT_SHA" ]; then
            echo "::error::${TAG} names ${tag_sha} and this image was built from ${BUILT_SHA}."
            exit 1
          fi

      # The body is written here from the commits themselves. GitHub's own
      # generated notes came out empty when this fork cut its first release --
      # the tag is on a branch the default branch does not contain -- and a
      # list made with git log cannot come out blank.
      - name: Write the release notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/personal'
        env:
          OLD_TAG: ${{ steps.version.outputs.old_tag }}
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${OLD_TAG}" >/dev/null; then
            range="${OLD_TAG}..${NEW_TAG}"
          elif git rev-parse -q --verify refs/remotes/origin/main >/dev/null; then
            # The first release: what this branch carries and main does not.
            range="origin/main..${NEW_TAG}"
          else
            range="${NEW_TAG} -n 20"
          fi
          {
            echo '## What this build changes'
            echo
            # shellcheck disable=SC2086
            git log --no-merges --invert-grep --grep='^ci:' --pretty='- %s (`%h`)' $range
            echo
            echo "Built from \`$(git rev-parse --short "${NEW_TAG}")\` on the \`personal\` branch."
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/personal'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          # The commit the tag names, recorded on the release itself.
          target_commitish: ${{ steps.source.outputs.sha }}
          # The list written above, rather than a generated body that can come
          # out empty.
          body_path: ${{ runner.temp }}/release-notes.md
          # The image and its checksum: both are needed to flash it, and a
          # release missing either is caught here rather than after a download.
          files: |
            sonix-packer/v1.upt
            sonix-packer/v1_md5.txt
          fail_on_unmatched_files: true


name: Build Sonix Player (host)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build-player.yml
      - sonix-player/Makefile
      - sonix-player/lv_conf.h
      - sonix-player/src/**
      - sonix-player/tests/**
  push:
    branches:
      - main
      - arena/**
    paths:
      - .github/workflows/build-player.yml
      - sonix-player/Makefile
      - sonix-player/lv_conf.h
      - sonix-player/src/**
      - sonix-player/tests/**

permissions:
  contents: read

concurrency:
  group: host-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile player and run core tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git make pkg-config \
            libsdl2-dev libasound2-dev libfreetype6-dev \
            libopusfile-dev libwavpack-dev

      - name: Build the host player
        run: make -C sonix-player host -j"$(nproc)"

      - name: Check the More, Calculator and Notes pages (headless LVGL)
        run: make -C sonix-player/tests ui -j"$(nproc)"

      - name: Check the battery guard (warning at five, shutdown at one)
        run: make -C sonix-player/tests batteryguard

      - name: Check the Calculator's arithmetic and the notes folder
        run: make -C sonix-player/tests calculator notes -j"$(nproc)"

      - name: Check EQ, PEQ and MSEB on PCM, including radio rates
        run: make -C sonix-player/tests eq

      - name: Check the Screensaver folder's picture rules
        run: make -C sonix-player/tests pictures

      - name: Check the Bootlogo folder and the custom boot picture
        run: make -C sonix-player/tests bootpic

      - name: Run Subsonic and stream-bridge tests
        run: make -C sonix-player/tests test

      - name: Check LRCLIB search, ranking and sidecar save
        run: make -C sonix-player/tests lrclib

      - name: Check tag reading, format sniffing and 1000-cover cache
        run: make -C sonix-player/tests tags covers

      - name: Check FLAC radio streams (native, mid-stream join, chained Ogg FLAC)
        run: make -C sonix-player/tests radioflac

      - name: Run stock-firmware credential extractor tests
        run: make -C sonix-player/tests extractkeys
